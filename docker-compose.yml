services:
  muebleria_ramirez_app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    image: muebleria-ramirez-app
    container_name: muebleria-ramirez
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: muebleria_ramirez_app
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - muebleria_ramirez_postgres
      - muebleria_ramirez_redis
    networks:
      - muebleria-ramirez-network

  webserver_muebleria_ramirez:
    image: nginx:alpine
    container_name: muebleria-ramirez-server
    restart: unless-stopped
    tty: true
    ports:
      - "${APP_PORT:-8070}:80"
    networks:
      - muebleria-ramirez-network
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

  muebleria_ramirez_postgres:
    image: postgres:18-alpine
    container_name: muebleria-ramirez-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-muebleria}
      POSTGRES_USER: ${DB_USERNAME:-muebleria}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - muebleria-ramirez-pgsql:/var/lib/postgresql
    ports:
      - "${FORWARD_DB_PORT:-54322}:5432"
    networks:
      - muebleria-ramirez-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-muebleria} -d ${DB_DATABASE:-muebleria}"]
      interval: 5s
      timeout: 5s
      retries: 10

  muebleria_ramirez_redis:
    image: redis:alpine
    container_name: muebleria-ramirez-redis
    restart: unless-stopped
    volumes:
      - muebleria-ramirez-redis:/data
    networks:
      - muebleria-ramirez-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  muebleria-ramirez-network:
    driver: bridge

volumes:
  muebleria-ramirez-pgsql:
    driver: local
  muebleria-ramirez-redis:
    driver: local
